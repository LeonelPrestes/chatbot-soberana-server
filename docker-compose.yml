services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5452:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8081
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatorio}
      JWT_EXPIRES: ${JWT_EXPIRES:-7d}
      IA_API_KEY: ${IA_API_KEY:?IA_API_KEY obrigatoria}
      TERMS_VERSION: ${TERMS_VERSION:-v1-dev}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-v1-dev}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-}
      DEV_USER_NAME: ${DEV_USER_NAME:-Usuário de Desenvolvimento}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - uploads:/app/dist/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
  uploads:
